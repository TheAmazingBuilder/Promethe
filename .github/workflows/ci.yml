name: CI

on:
  push:
    branches:
      - Features-promethe
  pull_request:
    branches:
      - main
      - Features-promethe

permissions:
  contents: read

concurrency:
  group: promethe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit
