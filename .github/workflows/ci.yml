name: CI

on:
  push:
    branches:
      - Features-promethe
  pull_request:
    branches:
      - main
      - Features-promethe

permissions:
  contents: read

concurrency:
  group: promethe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Generate initial Prisma migration SQL artifact
        run: |
          mkdir -p /tmp/promethe-prisma-baseline
          DATABASE_URL="postgresql://test:test@127.0.0.1:5432/promethe?schema=promethe_test" \
          DIRECT_URL="postgresql://test:test@127.0.0.1:5432/promethe?schema=promethe_test" \
            bunx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script \
            > /tmp/promethe-prisma-baseline/migration.sql
          printf 'provider = "postgresql"\n' > /tmp/promethe-prisma-baseline/migration_lock.toml

      - name: Upload generated Prisma baseline
        uses: actions/upload-artifact@v4
        with:
          name: promethe-prisma-baseline-${{ github.sha }}
          path: /tmp/promethe-prisma-baseline/
          retention-days: 1

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit
