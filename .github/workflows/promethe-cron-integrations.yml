# Promethe cron - integrations outbox (B7, prepared 25 Nov 2026).
# Calls POST /api/cron/integrations on production every 15 minutes:
# drains the Discord / Telegram outbox and sends the daily summaries
# that are due. Runs ONLY from the default branch (main): GitHub
# scheduled workflows never trigger from any other branch. This file
# must live on main.
# Needs a repository secret named CRON_SECRET (same value as the
# CRON_SECRET environment variable in Vercel, Production + Preview).
name: Promethe cron - integrations

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call integrations cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://promethe-nine.vercel.app/api/cron/integrations
